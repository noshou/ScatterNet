# PYTHON AIRLOCK
# ------------------------------------------------------------------------------
# PythonCall + CondaPkg are deliberately NOT dependencies of this environment.
# `Pkg.test` precompiles the whole test environment, and PythonCall's __init__
# resolves the CondaPkg (numpy + xraydb) env the moment PythonCall is *loaded*
# -- including inside a precompile worker. So as long as PythonCall is reachable
# from `test/Project.toml`, a bare `Pkg.test()` provisions conda before a single
# test runs, which is exactly what the airlock must prevent.
#
# They live in `test/xraydb/Project.toml` instead. The opt-in xraydb form-factor
# tests (`test_formfactor.jl`, enabled with SCATTERNET_TEST_XRAYDB=1) push that
# directory onto LOAD_PATH at runtime and only then `import PythonCall`, so the
# conda env is provisioned on the opt-in path and nowhere else.

[compat]
Aqua = "0.8"
JET = "0.9, 0.10, 0.11, 0.12"
